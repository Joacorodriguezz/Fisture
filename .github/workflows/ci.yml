name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    uses: ./.github/workflows/test-suite.yml

  build:
    # Nombre estable: el ruleset existente exige este check.
    name: build
    needs: [suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Exigir toda la suite
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$SUITE_RESULT" = "success"
