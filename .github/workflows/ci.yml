name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, development, feat/prode-cuentas-grupos, feat/prode-partidos-pronosticos]
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    # "edited" solo importa si cambió la base del PR; editar la descripción no relanza el E2E
    if: github.event.action != 'edited' || github.event.changes.base != null
    uses: ./.github/workflows/test-suite.yml

  build:
    # Nombre estable: el ruleset existente exige este check.
    name: build
    needs: [suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Exigir toda la suite
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        # skipped: solo al editar la descripción de un PR (ver el if de suite)
        run: test "$SUITE_RESULT" = "success" || test "$SUITE_RESULT" = "skipped"
