name: Keepalive de workflows

# GitHub desactiva los workflows con `schedule` tras 60 días sin actividad en el repo, sin avisar
# (docs/17 B1). Una vez por semana este workflow:
#  - vuelve a habilitar los workflows programados (sync-cron, monitor y este mismo) con la API;
#  - abre un issue "incidente" si alguno estaba desactivado o si el sync diario lleva más de 72 h
#    sin terminar bien, una señal independiente de la app (el monitor mira /api/health).
# Límite conocido: si el repo queda sin actividad y GitHub desactiva también este workflow, nada lo
# reactiva. Un deploy, un PR o cualquier commit reinician el plazo; el respaldo independiente de GitHub
# es un monitor externo sobre /api/health (docs/23 §5).
on:
  schedule:
    - cron: "0 12 * * 1" # lunes 12:00 UTC
  workflow_dispatch:

permissions:
  actions: write # habilitar workflows
  contents: read
  issues: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar los workflows programados y revisar el último sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/keepalive.mjs

      - name: Avisar por issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/incidente.sh abrir "Los workflows programados no están corriendo" \
            "El keepalive encontró workflows desactivados por GitHub o un sync diario atrasado (más de 72 h sin terminar bien). Los desactivados ya se reactivaron. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Revisar el log del run y docs/23-runbook-de-incidentes.md."

      - name: Cerrar el aviso si volvió a la normalidad
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/incidente.sh cerrar "Los workflows programados no están corriendo" "Todos los workflows programados están activos y el sync diario está al día: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
