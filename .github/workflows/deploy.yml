name: Deploy

# Producción: el proyecto "fisture" de Cloudflare Pages es de subida directa
# (sin Git conectado), así que el deploy lo hace este workflow al mergear a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test-suite.yml

  deploy:
    name: deploy
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: application
          path: dist/

      - name: Validar URL para smoke post-deploy
        env:
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
        run: node -e 'const u = new URL(process.env.PUBLIC_APP_URL); if (u.protocol !== "https:") process.exit(1)'

      # Migraciones antes del deploy (la app nueva puede depender de ellas).
      - name: Migrar D1 de producción
        run: npx wrangler d1 migrations apply fisture-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy a Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name fisture --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke de producción (solo lectura)
        run: npm run test:smoke
        env:
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}

      - name: Instrucciones si falla el release
        if: failure()
        run: |
          echo 'Release fallido. Revisar el paso que falló; si ya se desplegó, verificar producción y considerar rollback desde Cloudflare Pages.' >> "$GITHUB_STEP_SUMMARY"
          echo 'El rollback de código no revierte migraciones D1. Ver docs/13-testing-y-release.md.' >> "$GITHUB_STEP_SUMMARY"
