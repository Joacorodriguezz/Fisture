name = "fisture"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

# Base de datos D1
[[d1_databases]]
binding = "fisture_db"
database_name = "fisture-db"
database_id = "a2c8ced1-b931-43f7-9773-8702f7dce031"

# Cache KV para sesiones
[[kv_namespaces]]
binding = "KV"
id = "8a9fc92ed9774806833736d1bec711bb"

# Storage R2 para assets (opcional)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "fisture-assets"

# Cron job diario para sync de partidos
[triggers]
crons = ["0 9 * * *"]  # 9:00 UTC = 6:00 Argentina

[vars]
ENVIRONMENT = "development"
