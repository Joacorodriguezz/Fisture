name = "fisture"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

# Base de datos D1
[[d1_databases]]
binding = "DB"
database_name = "fisture-db"
database_id = "a2c8ced1-b931-43f7-9773-8702f7dce031"
migrations_dir = "drizzle/migrations"

# Cache KV para sesiones
[[kv_namespaces]]
binding = "KV"
id = "8a9fc92ed9774806833736d1bec711bb"

# Storage R2 para assets (opcional)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "fisture-assets"

# Pages no soporta Cron Triggers: el sync diario lo dispara
# .github/workflows/sync-cron.yml (POST /api/admin/sync).

[vars]
ENVIRONMENT = "production"
PUBLIC_APP_URL = "https://fisture.com"

# Logs y excepciones en el dashboard de Cloudflare (y `wrangler pages deployment tail`)
[observability]
enabled = true

# Staging (docs/26): deploys de preview de Pages (rama "development").
# Pages usa esta sección para todo deploy que no es de producción. Las claves no se heredan:
# bindings, vars y observability se repiten acá. La base y el KV son otros: staging nunca toca producción.
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "fisture-staging"
database_id = "4cfee6a5-856e-455b-a7ba-f99148a45364"
migrations_dir = "drizzle/migrations"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "eb9880ef072042d8b93e46a6ca9e49d7"

[env.preview.vars]
ENVIRONMENT = "staging"
PUBLIC_APP_URL = "https://development.fisture.pages.dev"

[env.preview.observability]
enabled = true
